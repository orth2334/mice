  <div id="barrierFreeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden transition-opacity duration-300 opacity-0 px-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-300 flex flex-col space-y-4">
      
      <!-- Header -->
      <div class="flex justify-between items-start pb-2 border-b border-slate-100">
        <div class="space-y-0.5">
          <h3 class="text-base font-extrabold text-slate-950 flex items-center gap-2">
            <i data-lucide="accessibility" class="w-5 h-5 text-blue-600"></i>
            무장애 & 포용적 행사 지수 산정
          </h3>
          <p class="text-[10px] text-slate-500">ISO 20121(S.2) 및 GRI 405/413 기준 이동·정보 접근성 & 포용성 지표 측정을 진행합니다.</p>
        </div>
        <button onclick="closeBarrierFreeModal()" class="text-slate-400 hover:text-slate-600 transition-colors pt-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Body -->
      <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
        <!-- Nickname Input -->
        <div class="space-y-1">
          <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider">참여자 닉네임 (선택)</label>
          <input type="text" id="barrier-free-username" placeholder="이름 또는 닉네임을 입력하세요 (선택)" 
                 class="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all font-medium">
        </div>

        <!-- 📊 Quantitative Metrics Section (정량 지표 입력) -->
        <div class="bg-blue-50/70 p-3 rounded-2xl border border-blue-100 space-y-2">
          <span class="text-[10px] font-black text-blue-800 uppercase tracking-wider block flex items-center gap-1">
            <i data-lucide="calculator" class="w-3.5 h-3.5 text-blue-600"></i>
            정량 수량 지표 입력 (GRI 405 / ISO 20121)
          </span>

          <div class="grid grid-cols-2 gap-2">
            <!-- 수어통역/자막 지원 시간 -->
            <div class="bg-white p-2 rounded-xl border border-blue-100/80 shadow-2xs">
              <label class="text-[10px] font-bold text-slate-700 block">수어/자막 지원 (시간)</label>
              <input type="number" id="bf-sign-hours" value="0" min="0" oninput="updateBarrierFreeUI()"
                     class="w-full mt-1 text-center text-xs font-extrabold text-blue-900 bg-slate-50 rounded-lg py-1 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
            </div>

            <!-- 사회적 배려/장애인 참가자 수 -->
            <div class="bg-white p-2 rounded-xl border border-blue-100/80 shadow-2xs">
              <label class="text-[10px] font-bold text-slate-700 block">배려/장애인 참가자 (명)</label>
              <input type="number" id="bf-participants-count" value="0" min="0" oninput="updateBarrierFreeUI()"
                     class="w-full mt-1 text-center text-xs font-extrabold text-blue-900 bg-slate-50 rounded-lg py-1 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
            </div>
          </div>
        </div>

        <!-- Checkbox Options (정성적 배리어프리 실천 항목 7종) -->
        <div class="space-y-2">
          <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider block">정성적 배리어프리 실천 항목 (7개 필수 점검)</span>
          
          <!-- Option 1: Ramp -->
          <label class="flex items-start bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition-colors hover:bg-slate-100/50 cursor-pointer select-none">
            <input type="checkbox" id="bf-ramp" onchange="updateBarrierFreeUI()" class="mt-0.5 mr-2.5 w-4 h-4 text-blue-600 border-slate-350 rounded focus:ring-blue-500">
            <div class="flex-grow">
              <h4 class="text-xs font-bold text-slate-800">무장애 이동 동선 (슬로프/턱 제거)</h4>
              <p class="text-[9px] text-slate-450 leading-tight mt-0.5">행사장 턱 제거, 슬로프 및 경사로 설치로 휠체어/유아차 이동 자유화</p>
            </div>
          </label>

          <!-- Option 2: Desk -->
          <label class="flex items-start bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition-colors hover:bg-slate-100/50 cursor-pointer select-none">
            <input type="checkbox" id="bf-desk" onchange="updateBarrierFreeUI()" class="mt-0.5 mr-2.5 w-4 h-4 text-blue-600 border-slate-350 rounded focus:ring-blue-500">
            <div class="flex-grow">
              <h4 class="text-xs font-bold text-slate-800">저단 등록 데스크 운영</h4>
              <p class="text-[9px] text-slate-450 leading-tight mt-0.5">휠체어 사용자 눈높이에 맞춘 별도의 낮은 등록 및 상담 데스크 운영</p>
            </div>
          </label>

          <!-- Option 3: Facility -->
          <label class="flex items-start bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition-colors hover:bg-slate-100/50 cursor-pointer select-none">
            <input type="checkbox" id="bf-facility" onchange="updateBarrierFreeUI()" class="mt-0.5 mr-2.5 w-4 h-4 text-blue-600 border-slate-350 rounded focus:ring-blue-500">
            <div class="flex-grow">
              <h4 class="text-xs font-bold text-slate-800">장애인 편의시설 & 전용석 확보</h4>
              <p class="text-[9px] text-slate-450 leading-tight mt-0.5">장애인 화장실 및 세션장 내 전용 휠체어석 보장 및 안내 동선 확보</p>
            </div>
          </label>

          <!-- Option 4: Sign Language -->
          <label class="flex items-start bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition-colors hover:bg-slate-100/50 cursor-pointer select-none">
            <input type="checkbox" id="bf-sign" onchange="updateBarrierFreeUI()" class="mt-0.5 mr-2.5 w-4 h-4 text-blue-600 border-slate-350 rounded focus:ring-blue-500">
            <div class="flex-grow">
              <h4 class="text-xs font-bold text-slate-800">수어 통역 및 실시간 자막</h4>
              <p class="text-[9px] text-slate-450 leading-tight mt-0.5">전문 수어 통역사 상시 대기 및 주요 세션 스크린 실시간 텍스트 자막 송출</p>
            </div>
          </label>

          <!-- Option 5: Easy Read -->
          <label class="flex items-start bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition-colors hover:bg-slate-100/50 cursor-pointer select-none">
            <input type="checkbox" id="bf-easy" onchange="updateBarrierFreeUI()" class="mt-0.5 mr-2.5 w-4 h-4 text-blue-600 border-slate-350 rounded focus:ring-blue-500">
            <div class="flex-grow">
              <h4 class="text-xs font-bold text-slate-800">쉬운 언어 (Easy Read) 안내서</h4>
              <p class="text-[9px] text-slate-450 leading-tight mt-0.5">발달장애인 및 노년층을 위해 핵심 내용을 직관적인 단어와 그림으로 재구성한 안내서 배포</p>
            </div>
          </label>

          <!-- Option 6: Braille & QR -->
          <label class="flex items-start bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition-colors hover:bg-slate-100/50 cursor-pointer select-none">
            <input type="checkbox" id="bf-braille" onchange="updateBarrierFreeUI()" class="mt-0.5 mr-2.5 w-4 h-4 text-blue-600 border-slate-350 rounded focus:ring-blue-500">
            <div class="flex-grow">
              <h4 class="text-xs font-bold text-slate-800">점자/음성안내 QR 코드 배치</h4>
              <p class="text-[9px] text-slate-450 leading-tight mt-0.5">주요 시설물 점자 표기 및 모바일로 즉시 읽을 수 있는 음성 해설 QR 연동</p>
            </div>
          </label>

          <!-- Option 7: Helper -->
          <label class="flex items-start bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition-colors hover:bg-slate-100/50 cursor-pointer select-none">
            <input type="checkbox" id="bf-helper" onchange="updateBarrierFreeUI()" class="mt-0.5 mr-2.5 w-4 h-4 text-blue-600 border-slate-350 rounded focus:ring-blue-500">
            <div class="flex-grow">
              <h4 class="text-xs font-bold text-slate-800">이동 보조 스태프 및 안내견 보장</h4>
              <p class="text-[9px] text-slate-450 leading-tight mt-0.5">휠체어 이동 보조 전담 요원 상주 및 시각장애인 보조견 동반 출입 및 편의 보장</p>
            </div>
          </label>
        </div>

        <!-- 📈 Real-Time Impact Summary Section -->
        <div class="bg-slate-900 text-white p-3 rounded-2xl space-y-1.5 shadow-md">
          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-300 font-medium text-[11px]">무장애 포용성 달성률 (Score)</span>
            <div class="flex items-center gap-1.5">
              <span id="bf-score-rate" class="font-black text-blue-300 text-sm">0.0%</span>
              <span id="bf-certified-badge" class="text-[9px] font-extrabold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">미달성</span>
            </div>
          </div>
          <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="bf-score-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <div class="flex justify-between items-center text-[10px] text-slate-400 pt-0.5">
            <span>실천 항목: <strong id="bf-checked-count" class="text-white">0</strong> / 7개</span>
            <span id="bf-social-summary" class="text-blue-200">수어 0시간 | 배려참가자 0명</span>
          </div>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="pt-3 border-t border-slate-100 flex justify-end space-x-2">
        <button onclick="closeBarrierFreeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl hover:bg-slate-200 transition-all active:scale-98">
          취소
        </button>
        <button id="btn-submit-barrier-free" disabled onclick="submitBarrierFree()" class="bg-slate-300 text-slate-500 cursor-not-allowed text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5 active:scale-98">
          <i data-lucide="check" class="w-3.5 h-3.5"></i>
          포용성 지수 실천 등록하기
        </button>
      </div>
    </div>
  </div>
