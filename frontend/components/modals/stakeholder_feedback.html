  <!-- ==========================================
       MODAL POPUP FOR STAKEHOLDER FEEDBACK & LIVE ESG PLEDGES (이해관계자 의견 수렴 & 참가자 ESG 방명록)
       ========================================== -->
  <div id="stakeholderFeedbackModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden transition-opacity duration-300 opacity-0 px-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-300 flex flex-col space-y-4 max-h-[90vh] overflow-y-auto">
      
      <!-- Header -->
      <div class="flex justify-between items-start pb-3 border-b border-slate-100">
        <div class="space-y-0.5">
          <div class="flex items-center gap-2">
            <span class="bg-indigo-100 text-indigo-700 text-[10px] font-black px-2 py-0.5 rounded-full">지배구조 (G) & 시민 참여</span>
            <span class="text-[10px] text-slate-400 font-bold">GRI 2-29 이해관계자 소통</span>
          </div>
          <h3 class="text-base font-extrabold text-slate-950 flex items-center gap-2 mt-1">
            <i data-lucide="message-square-heart" class="w-5 h-5 text-indigo-600"></i>
            도민·참가자 ESG 한줄 다짐 & 피드백 방명록
          </h3>
        </div>
        <button onclick="closeStakeholderFeedbackModal()" class="text-slate-400 hover:text-slate-600 transition-colors pt-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Tab Navigation -->
      <div class="flex border-b border-slate-100 space-x-2">
        <button id="tab-btn-pledge" onclick="switchStakeholderTab('pledge')" class="pb-2 text-xs font-extrabold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-1.5 transition-all">
          <i data-lucide="heart" class="w-3.5 h-3.5"></i>
          참가자 ESG 한줄 다짐 방명록
        </button>
        <button id="tab-btn-official" onclick="switchStakeholderTab('official')" class="pb-2 text-xs font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 flex items-center gap-1.5 transition-all">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
          자문단 회의록 & 공식 보고서
        </button>
      </div>

      <!-- Tab 1: Live ESG Pledge Guestbook (참가자 한줄 다짐) -->
      <div id="tab-content-pledge" class="space-y-4">
        
        <!-- Pledge Input Form -->
        <div class="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-[11px] font-black text-indigo-900 flex items-center gap-1">
              <i data-lucide="pen-tool" class="w-3.5 h-3.5 text-indigo-600"></i>
              나의 친환경 ESG 실천 한줄 다짐 작성
            </span>
            <span class="text-[9px] bg-white text-indigo-700 font-extrabold px-2 py-0.5 rounded-full border border-indigo-200">
              💡 다짐 1건당 1,000원 기부금 적립
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[9px] font-black text-slate-500 uppercase block mb-1">닉네임 / 성명</label>
              <input type="text" id="pledge-username" placeholder="예: 탄소제로도민" class="w-full text-xs px-3 py-1.5 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 font-medium">
            </div>
            <div>
              <label class="text-[9px] font-black text-slate-500 uppercase block mb-1">참가자 구분</label>
              <select id="pledge-role" class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 font-medium">
                <option value="도민·참관객">도민 · 참관객</option>
                <option value="연사·발표자">연사 · 발표자</option>
                <option value="행사 스태프">행사 스태프</option>
                <option value="청년 서포터즈">청년 서포터즈</option>
              </select>
            </div>
          </div>

          <div>
            <label class="text-[9px] font-black text-slate-500 uppercase block mb-1">실천 다짐 주제</label>
            <select id="pledge-category" class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 font-medium">
              <option value="텀블러/다회용기">🍵 텀블러 및 다회용기 상시 사용하기</option>
              <option value="대중교통 이용">🚌 대중교통 및 도보 이동 실천하기</option>
              <option value="잔반 제로">🥗 식사 시 먹을 만큼만 받아 잔반 없애기</option>
              <option value="페이퍼리스">📱 인쇄물 대신 모바일 QR 자료 이용하기</option>
              <option value="자유 다짐">💚 지속가능한 MICE를 위한 자유 소평/피드백</option>
            </select>
          </div>

          <div>
            <label class="text-[9px] font-black text-slate-500 uppercase block mb-1">한줄 다짐 & 응원 메시지 (최대 100자)</label>
            <textarea id="pledge-message" rows="2" placeholder="행사장에 텀블러를 챙겨왔습니다! 환경을 생각하는 지속가능한 행사를 응원합니다 💚" class="w-full text-xs p-2.5 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 leading-normal font-medium"></textarea>
          </div>

          <button onclick="submitPledge()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold py-2 rounded-xl transition-all shadow-md active:scale-98 flex items-center justify-center gap-1.5">
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
            ESG 한줄 다짐 등록하기 & 방명록 반영
          </button>
        </div>

        <!-- Live Pledges Feed Container -->
        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider flex items-center gap-1">
              <i data-lucide="rss" class="w-3 h-3 text-indigo-500"></i>
              실시간 등록된 ESG 다짐 방명록 (<span id="pledge-total-count" class="text-indigo-600 font-extrabold">3</span>건)
            </span>
            <span class="text-[10px] text-indigo-600 font-bold" id="pledge-donation-fund">누적 기부 펀드: 3,000원</span>
          </div>

          <div id="pledges-feed-list" class="space-y-2 max-h-[180px] overflow-y-auto pr-1">
            <!-- Dynamic items rendered by JS -->
          </div>
        </div>

      </div>

      <!-- Tab 2: Official Advisory Minutes (자문단 회의록 공시) -->
      <div id="tab-content-official" class="space-y-3 hidden">
        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-150 space-y-1.5">
          <p class="font-extrabold text-slate-800 text-xs flex items-center gap-1.5">
            <i data-lucide="shield-check" class="w-4 h-4 text-indigo-600"></i>
            이해관계자 자문단 회의록 및 의견 수렴 보고서
          </p>
          <p class="text-[10px] text-slate-500 leading-normal">
            외부 ESG 전문가 및 도민 자문단 회의록 문서를 첨부하여 공식 피드백 수렴 내역을 검증받습니다.
          </p>
        </div>

        <div class="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-150">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[9px] font-black text-slate-400 block mb-1">회의 일시</label>
              <input type="text" id="stakeholder-date" value="2026년 7월 20일 (월)" class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-xl bg-white">
            </div>
            <div>
              <label class="text-[9px] font-black text-slate-400 block mb-1">참석 자문위원</label>
              <input type="text" id="stakeholder-members" value="도민위원, 전문가 총 12명" class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-xl bg-white">
            </div>
          </div>
          <div>
            <label class="text-[9px] font-black text-slate-400 block mb-1">주요 안건 및 조치 결과</label>
            <textarea id="stakeholder-summary" rows="2" class="w-full text-xs p-2.5 border border-slate-200 rounded-xl bg-white">다회용기 수거함 추가 설치 및 교통약자 이동 보조요원 배치 안건 의결 및 즉시 반영 조치함.</textarea>
          </div>
          <div>
            <span class="text-[9px] font-black text-slate-400 block mb-1">자문단 회의록 문서 첨부</span>
            <label for="stakeholder-file-upload" class="flex flex-col items-center justify-center w-full p-2.5 border-2 border-dashed border-indigo-200 rounded-xl cursor-pointer hover:bg-indigo-50/50">
              <div id="stakeholder-preview-container" class="flex flex-col items-center justify-center text-center">
                <p class="text-[10px] text-indigo-950 font-bold" id="stakeholder-filename">2026_MICE_이해관계자_자문단_회의록.pdf</p>
                <p class="text-[9px] text-slate-400">클릭하여 다른 첨부문서로 교체 가능</p>
              </div>
              <input id="stakeholder-file-upload" type="file" accept=".pdf,.hwp,.docx,.doc,image/*" class="hidden" onchange="handleStakeholderFileChange(event)">
            </label>
          </div>
        </div>

        <div class="pt-2 flex justify-end">
          <button id="btn-submit-stakeholder" onclick="submitStakeholderFeedback()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5">
            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
            자문단 회의록 공시 등록
          </button>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="pt-2 border-t border-slate-100 flex justify-end">
        <button onclick="closeStakeholderFeedbackModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl hover:bg-slate-200 transition-all">
          닫기
        </button>
      </div>
    </div>
  </div>
