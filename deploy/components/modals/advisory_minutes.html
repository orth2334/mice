  <!-- ==========================================
       MODAL POPUP FOR ADVISORY MINUTES & OFFICIAL REPORT (이해관계자 자문단 회의록 & 공식 보고서 공시)
       ========================================== -->
  <div id="advisoryMinutesModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden transition-opacity duration-300 opacity-0 px-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-300 flex flex-col space-y-4 max-h-[90vh] overflow-y-auto">
      
      <!-- Header -->
      <div class="flex justify-between items-start pb-3 border-b border-slate-100">
        <div class="space-y-0.5">
          <div class="flex items-center gap-2">
            <span class="bg-indigo-100 text-indigo-700 text-[10px] font-black px-2 py-0.5 rounded-full">지배구조 (G) 실천 증명</span>
            <span class="text-[10px] text-slate-400 font-bold">GRI 2-29 공식 지배구조</span>
          </div>
          <h3 class="text-base font-extrabold text-slate-950 flex items-center gap-2 mt-1">
            <i data-lucide="file-text" class="w-5 h-5 text-indigo-600"></i>
            이해관계자 자문단 회의록 & 공식 보고서 공시
          </h3>
        </div>
        <button onclick="closeAdvisoryMinutesModal()" class="text-slate-400 hover:text-slate-600 transition-colors pt-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Content Body -->
      <div class="space-y-4 text-xs text-slate-600 leading-relaxed">
        
        <!-- Explanation Banner -->
        <div class="bg-indigo-50/70 p-3.5 rounded-2xl border border-indigo-100 space-y-1">
          <p class="font-extrabold text-indigo-900 flex items-center gap-1.5 text-xs">
            <i data-lucide="shield-check" class="w-4 h-4 text-indigo-600"></i>
            공식 자문단 회의록 공시 안내
          </p>
          <p class="text-[11px] text-slate-600 leading-normal">
            외부 ESG 전문가 및 도민 자문단이 개최한 공식 회의록 및 의견 수렴 보고서(PDF, HWP, DOCX)를 첨부하여 투명하게 공시합니다.
          </p>
        </div>

        <!-- Meeting Summary Details Form -->
        <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-150">
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider block">회의 개최 일시</label>
              <input type="text" id="advisory-min-date" value="2026년 7월 20일 (월)" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 font-medium">
            </div>
            <div class="space-y-1">
              <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider block">참석 자문위원</label>
              <input type="text" id="advisory-min-members" value="도민위원, 외부 ESG전문가 (총 12명)" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 font-medium">
            </div>
          </div>

          <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider block">주요 의결 안건 및 조치 계획 요약</label>
            <textarea id="advisory-min-summary" rows="3" class="w-full text-xs p-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 leading-normal font-medium">행사 내 다회용기 회수율 제고를 위한 수거함 확대 배치 및 교통약자 무장애 동선 전담 요원 배치 안건 의결 완료.</textarea>
          </div>

          <!-- File Upload Zone -->
          <div class="space-y-1.5 pt-1">
            <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider block">자문단 회의록 파일 첨부 *</span>
            <label for="advisory-min-file-upload" class="flex flex-col items-center justify-center w-full min-h-[95px] p-3 border-2 border-dashed border-indigo-200 rounded-2xl cursor-pointer hover:bg-indigo-50/50 hover:border-indigo-400 transition-colors">
              <div id="advisory-min-preview-container" class="flex flex-col items-center justify-center text-center">
                <i data-lucide="file-text" id="advisory-min-upload-icon" class="w-7 h-7 text-indigo-500 mb-1"></i>
                <p class="text-[11px] text-indigo-950 font-bold mb-0.5" id="advisory-min-filename">2026_MICE_이해관계자_자문단_회의록_및_의견수렴보고서.pdf</p>
                <p class="text-[9px] text-slate-400">클릭하여 다른 첨부문서(PDF, HWP, DOCX)로 교체 가능 (최대 30MB)</p>
              </div>
              <input id="advisory-min-file-upload" type="file" accept=".pdf,.hwp,.docx,.doc,image/*" class="hidden" onchange="handleAdvisoryMinFileChange(event)">
            </label>
          </div>
        </div>

      </div>

      <!-- Footer Buttons -->
      <div class="pt-3 border-t border-slate-100 flex justify-end space-x-2">
        <button onclick="closeAdvisoryMinutesModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl hover:bg-slate-200 transition-all">
          닫기
        </button>
        <button id="btn-submit-advisory-min" onclick="submitAdvisoryMinutes()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-md flex items-center gap-1.5 active:scale-98">
          <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
          자문단 회의록 문서 첨부 및 공시 제출
        </button>
      </div>
    </div>
  </div>
