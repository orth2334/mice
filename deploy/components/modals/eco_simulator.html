  <!-- Modal Container -->
  <div id="ecoSimulatorModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden transition-opacity duration-300 opacity-0 px-4 py-6 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-4xl w-full p-8 sm:p-10 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-300 flex flex-col space-y-7">
      
      <!-- Header -->
      <div class="flex justify-between items-start pb-4 border-b border-slate-100">
        <div class="space-y-1.5">
          <h3 class="text-xl sm:text-2xl font-black text-slate-950 flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
              <i data-lucide="cup-soda" class="w-6 h-6"></i>
            </div>
            나의 다회용기 탄소감축 실천
          </h3>
          <p class="text-sm text-slate-500">일회용기 대신 다회용 식기를 사용하여 온실가스를 줄여주세요.</p>
        </div>
        <button onclick="closeEcoSimulatorModal()" class="w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-400 hover:text-slate-600 transition-colors flex items-center justify-center cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Body -->
      <div class="space-y-6">
        <!-- Nickname Input -->
        <div class="space-y-2">
          <label class="text-xs sm:text-sm font-black text-slate-600 uppercase tracking-wider">참여자 닉네임 (선택)</label>
          <input type="text" id="eco-username" placeholder="이름 또는 닉네임을 입력하세요 (선택)" 
                 class="w-full text-base px-5 py-3.5 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all font-medium">
        </div>

        <!-- Items Counters (2-Column Grid on sm+) -->
        <div class="space-y-2.5">
          <span class="text-xs sm:text-sm font-black text-slate-600 uppercase tracking-wider block">실천할 품목 수량</span>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- 1. Cup -->
            <div class="flex items-center justify-between bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-100 transition-colors hover:bg-slate-100/70">
              <div class="flex items-center space-x-3.5">
                <span class="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                  <i data-lucide="cup-soda" class="w-5 h-5"></i>
                </span>
                <div>
                  <h4 class="text-sm sm:text-base font-black text-slate-800">다회용 컵</h4>
                  <p class="text-xs text-slate-500 font-semibold" id="eco-cup-ef-text">-52 gCO2eq / 개</p>
                </div>
              </div>
              <div class="flex items-center space-x-2.5">
                <button onclick="changeQty('cup', -1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="minus" class="w-4 h-4"></i></button>
                <span id="qty-cup" class="w-9 text-center text-base sm:text-lg font-black text-slate-800 select-none">0</span>
                <button onclick="changeQty('cup', 1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="plus" class="w-4 h-4"></i></button>
              </div>
            </div>

            <!-- 2. Plate -->
            <div class="flex items-center justify-between bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-100 transition-colors hover:bg-slate-100/70">
              <div class="flex items-center space-x-3.5">
                <span class="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                  <i data-lucide="utensils" class="w-5 h-5"></i>
                </span>
                <div>
                  <h4 class="text-sm sm:text-base font-black text-slate-800">다회용 접시</h4>
                  <p class="text-xs text-slate-500 font-semibold" id="eco-plate-ef-text">-37 gCO2eq / 개</p>
                </div>
              </div>
              <div class="flex items-center space-x-2.5">
                <button onclick="changeQty('plate', -1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="minus" class="w-4 h-4"></i></button>
                <span id="qty-plate" class="w-9 text-center text-base sm:text-lg font-black text-slate-800 select-none">0</span>
                <button onclick="changeQty('plate', 1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="plus" class="w-4 h-4"></i></button>
              </div>
            </div>

            <!-- 3. Bowl -->
            <div class="flex items-center justify-between bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-100 transition-colors hover:bg-slate-100/70">
              <div class="flex items-center space-x-3.5">
                <span class="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                  <i data-lucide="soup" class="w-5 h-5"></i>
                </span>
                <div>
                  <h4 class="text-sm sm:text-base font-black text-slate-800">다회용 볼</h4>
                  <p class="text-xs text-slate-500 font-semibold" id="eco-bowl-ef-text">-60 gCO2eq / 개</p>
                </div>
              </div>
              <div class="flex items-center space-x-2.5">
                <button onclick="changeQty('bowl', -1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="minus" class="w-4 h-4"></i></button>
                <span id="qty-bowl" class="w-9 text-center text-base sm:text-lg font-black text-slate-800 select-none">0</span>
                <button onclick="changeQty('bowl', 1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="plus" class="w-4 h-4"></i></button>
              </div>
            </div>

            <!-- 4. Fork -->
            <div class="flex items-center justify-between bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-100 transition-colors hover:bg-slate-100/70">
              <div class="flex items-center space-x-3.5">
                <span class="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                  <i data-lucide="hand-metal" class="w-5 h-5"></i>
                </span>
                <div>
                  <h4 class="text-sm sm:text-base font-black text-slate-800">다회용 포크</h4>
                  <p class="text-xs text-slate-500 font-semibold" id="eco-fork-ef-text">-9 gCO2eq / 개</p>
                </div>
              </div>
              <div class="flex items-center space-x-2.5">
                <button onclick="changeQty('fork', -1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="minus" class="w-4 h-4"></i></button>
                <span id="qty-fork" class="w-9 text-center text-base sm:text-lg font-black text-slate-800 select-none">0</span>
                <button onclick="changeQty('fork', 1)" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all shadow-2xs cursor-pointer"><i data-lucide="plus" class="w-4 h-4"></i></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Active EF Note -->
        <div class="flex items-center justify-between text-xs sm:text-sm text-slate-500 bg-slate-50 px-5 py-3.5 rounded-2xl border border-slate-100 font-medium">
          <span class="flex items-center gap-2">
            <i data-lucide="tag" class="w-4 h-4 text-emerald-600"></i>
            <span>적용 배출계수 기준: <strong id="eco-ef-source-name" class="text-emerald-800 font-extrabold">한국 기본 (환경부 2024)</strong></span>
          </span>
          <button type="button" onclick="openEmissionFactorModal()" class="text-blue-600 hover:text-blue-800 font-bold underline cursor-pointer flex items-center gap-1">
            <i data-lucide="sliders" class="w-3.5 h-3.5"></i> 계수 변경
          </button>
        </div>

        <!-- Result Summary Board -->
        <div class="bg-emerald-50/70 rounded-2xl p-6 sm:p-7 border border-emerald-200/80 flex justify-between items-center transition-all duration-300">
          <div>
            <span class="text-xs sm:text-sm font-extrabold text-emerald-800 uppercase tracking-widest block">Expected CO2 Reduction</span>
            <span class="text-xs sm:text-sm text-slate-500 font-medium">실시간 예상 탄소 감축 결과</span>
          </div>
          <div class="text-right">
            <span id="eco-carbon-summary" class="text-3xl sm:text-4xl font-black text-emerald-600 leading-none">0 gCO2eq</span>
          </div>
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
        <button onclick="closeEcoSimulatorModal()" class="border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm sm:text-base font-bold px-6 sm:px-7 py-3 rounded-2xl transition-colors cursor-pointer">취소</button>
        <button onclick="submitEcoSimulation()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm sm:text-base font-black px-7 sm:px-8 py-3 rounded-2xl transition-all shadow-md hover:shadow-lg flex items-center gap-2.5 active:scale-98 cursor-pointer">
          <i data-lucide="check" class="w-5 h-5"></i>
          실천 완료
        </button>
      </div>
    </div>
  </div>
