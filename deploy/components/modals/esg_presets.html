<!-- ESG Presets Modal (App-Internal Save/Load Slot Manager) -->
<div id="esgPresetsModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center hidden transition-opacity duration-300 opacity-0 px-4 py-6 overflow-y-auto">
  <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full flex flex-col overflow-hidden border border-slate-100 transform transition-all duration-300 scale-95">
    
    <!-- Modal Header Controls -->
    <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between flex-shrink-0">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
          <i data-lucide="bookmark" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-sm font-extrabold tracking-tight text-white flex items-center gap-2">
            ESG 실천 데이터 저장 및 불러오기 (프로그램 내 보관함)
            <span class="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">MUREPA KOREA</span>
          </h3>
          <p class="text-[11px] text-slate-400">현재 카드의 결과값을 프로그램 내부 슬롯에 저장하거나 불러옵니다.</p>
        </div>
      </div>
      <button onclick="closeEsgPresetsModal()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors flex items-center justify-center cursor-pointer">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Save Current State Form -->
    <div class="p-5 bg-slate-50 border-b border-slate-200/80 space-y-2.5">
      <h4 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
        <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-600"></i>
        현재 작성된 카드 데이터 프로그램에 저장하기
      </h4>
      <div class="flex gap-2">
        <input id="preset-title-input" type="text" placeholder="저장할 데이터 이름 입력 (예: 2026 MICE 컨퍼런스 1일차, 상반기 전시회)" class="flex-grow px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
        <button onclick="saveCurrentPresetInApp()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center gap-1.5 cursor-pointer flex-shrink-0">
          <i data-lucide="save" class="w-4 h-4"></i>
          현재 설정 저장
        </button>
      </div>
    </div>

    <!-- Saved Slots List -->
    <div class="p-6 space-y-4 max-h-[55vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h4 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="folder-open" class="w-4 h-4 text-slate-600"></i>
          프로그램 내 저장된 ESG 슬롯 목록
        </h4>
        <span id="presets-count-badge" class="text-[11px] font-bold text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded-full">0개 저장됨</span>
      </div>

      <div id="presets-list-container" class="space-y-2.5">
        <!-- Dynamic preset items render here -->
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="px-6 py-3.5 bg-slate-50 border-t border-slate-100 flex justify-between items-center flex-shrink-0">
      <span class="text-xs text-slate-500 font-medium">💡 프로그램 내부 저장소에 보관되므로 파일 생성 없이 바로 불러올 수 있습니다.</span>
      <button onclick="closeEsgPresetsModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">
        닫기
      </button>
    </div>

  </div>
</div>
